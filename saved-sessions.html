<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Sessions — Mirai Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00061B">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
.page-transition{position:fixed;inset:0;background:#00061B;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s ease}
.page-transition.active{opacity:1;pointer-events:all}
.rv{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}
.topbar{transform:translateZ(0);will-change:auto}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.rolechip{font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#46DCEA;border:1px solid rgba(70,220,234,.3);background:rgba(70,220,234,.07);padding:6px 12px;border-radius:999px;font-family:'Poppins',sans-serif;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2654c5,#0b8fa8);font-weight:800;font-size:13px;color:#fff;font-family:'Poppins',sans-serif;flex-shrink:0}
.logout{color:#8A93A8;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:'Poppins',sans-serif}
.logout:hover{color:#fff}
.topbar{position:sticky;top:0;z-index:100;background:rgba(1,4,20,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar-in{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0;min-width:120px}
.brand img{height:28px;width:auto;display:block}
nav.mainnav{display:flex;gap:4px;margin-left:8px}
nav.mainnav a{font-family:'Poppins',sans-serif;color:#8A93A8;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:8px;white-space:nowrap}
nav.mainnav a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.mainnav a.active{color:#fff;background:rgba(25,76,209,.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{zoom:0.8;font-family:'Poppins',sans-serif;background:#00061B;color:#E8ECF4;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:32px 24px}
h1{font-size:28px;font-weight:800;margin-bottom:8px}
.sub{color:#8A93A8;font-size:14px;margin-bottom:24px}
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.filters select{background:#0A1128;border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 14px;border-radius:8px;font-family:inherit;font-size:13px}
.session-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px;margin-bottom:16px}
.session-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.session-subject{font-size:16px;font-weight:700}
.session-meta{color:#8A93A8;font-size:12px;margin-top:4px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.Completed{background:rgba(6,155,173,.2);color:#46DCEA}
.badge.In.Progress{background:rgba(255,193,7,.2);color:#FFC107}
.badge.Skipped{background:rgba(255,107,107,.18);color:#FF8A8A}
.badge.Merged{background:rgba(160,140,255,.18);color:#C8B6FF}
.badge.Cancelled{background:rgba(255,255,255,.1);color:#8A93A8}
.session-body{color:#B8C0D0;font-size:13px;line-height:1.6}
.empty{text-align:center;padding:60px 20px;color:#8A93A8}
.loading{text-align:center;padding:40px;color:#8A93A8}
@media(max-width:900px){body{zoom:1 !important}}
</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
<a class="brand" id="brandHome" href="dashboard.html"><img src="https://admin.miraisot.com/uploads/Logo_67db14a300.svg" alt="Mirai"></a>
<nav class="mainnav">
<a id="navDash" href="dashboard.html">Dashboard</a><a id="navSubjects" href="subjects.html">Subjects</a><a id="navExams" href="exams.html">Exam readiness</a>
<a id="navFaculty" href="faculty.html">Faculty</a><a id="navStudents" href="students.html">Students</a><a id="navCalendar" href="calendar.html">Calendar</a>
<a id="navSessions" href="saved-sessions.html" class="active">Sessions</a>
</nav>
<div class="top-right">
<span class="rolechip" id="roleChip">Student</span>
<span class="avatar" id="avatarInit">S</span>
<a class="logout" href="index.html">Log out</a>
</div>
</div></header>
<div class="wrap">
<h1 id="pageTitle">My Saved Sessions</h1>
<p class="sub" id="pageSub">Sessions you have logged, stored in the database.</p>
<div class="filters" id="managerFilters" style="display:none">
<select id="facultyFilter"><option value="">All Faculty</option></select>
<select id="subjectFilter"><option value="">All Subjects</option></select>
<select id="statusFilter"><option value="">All Status</option><option>Completed</option><option>In Progress</option><option>Skipped</option><option>Merged</option><option>Cancelled</option></select>
</div>
<div class="filters" id="facultyFilters" style="display:none">
<select id="fSubjectFilter"><option value="">All My Subjects</option></select>
<select id="fStatusFilter"><option value="">All Status</option><option>Completed</option><option>In Progress</option><option>Skipped</option><option>Merged</option><option>Cancelled</option></select>
</div>
<div id="sessionsList"><div class="loading">Loading sessions...</div></div>
</div>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  /* identity — same resolution as every other page */
  var params=new URLSearchParams(window.location.search);
  var role=(params.get('role')||localStorage.getItem('mirai_role')||'student').toLowerCase();
  try{localStorage.setItem('mirai_role',role);}catch(e){}
  var facId=params.get('fac')||localStorage.getItem('mirai_fac')||'';
  try{if(facId)localStorage.setItem('mirai_fac',facId);}catch(e){}
  var isManager=role==='manager', isFaculty=role==='faculty';
  var FACULTY_NAMES={vishal:'Vishal Rathee',varun:'Varun Kumar Sharma',gaurav:'Gaurav Singh',aman:'Aman Srivastava',suman:'Suman Rajput',himanshu:'Dr. Himanshu Kumar',zakir:'Zakir Husain',soniya:'Soniya Tyagi'};
  var meName=(isFaculty&&facId)?(FACULTY_NAMES[facId]||''):'';
  function facInitials(n){ return n.split(' ').map(function(w){return w[0];}).filter(function(c){return /[A-Z]/.test(c);}).slice(0,2).join('')||n[0]; }
  $('roleChip').textContent=isManager?'Campus Controller':(meName?meName:(isFaculty?'Faculty':'Student'));
  $('avatarInit').textContent=isManager?'C':(meName?facInitials(meName):(isFaculty?'F':'S'));
  var q='?role='+role+(facId?'&fac='+facId:'');
  $('brandHome').href=(isManager?'manager.html':'dashboard.html')+q;
  ['navDash','navSubjects','navExams','navFaculty','navStudents','navCalendar','navSessions'].forEach(function(id){
    var el=$(id); if(el) el.href=el.getAttribute('href').split('?')[0]+q;
  });
  if(!isFaculty&&!isManager){ var ns=$('navStudents'); if(ns) ns.style.display='none'; }
  /* Sessions is a faculty/manager section — students go straight to their dashboard */
  if(!isFaculty&&!isManager){
    location.replace('dashboard.html'+q);
    return;
  }
  $('pageTitle').textContent=isManager?'All Saved Sessions':'My Saved Sessions';
  $('managerFilters').style.display=isManager?'flex':'none';
  $('facultyFilters').style.display=isManager?'none':'flex';
  var allSessions=[];
  function fillSelect(sel, values, keepFirst){
    var cur=sel.value;
    sel.innerHTML='';
    var first=document.createElement('option'); first.value=''; first.textContent=keepFirst; sel.appendChild(first);
    values.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
    sel.value=cur;
  }
  function populateFilters(){
    var facs={}, subs={};
    allSessions.forEach(function(s){
      if(s.faculty&&s.faculty.name) facs[s.faculty.name]=1;
      if(s.subjects&&s.subjects.name) subs[s.subjects.name]=1;
    });
    if(isManager){
      fillSelect($('facultyFilter'), Object.keys(facs).sort(), 'All Faculty');
      fillSelect($('subjectFilter'), Object.keys(subs).sort(), 'All Subjects');
    } else {
      fillSelect($('fSubjectFilter'), Object.keys(subs).sort(), 'All My Subjects');
    }
  }
  function currentFilters(){
    if(isManager) return {fac:$('facultyFilter').value, sub:$('subjectFilter').value, st:$('statusFilter').value};
    return {fac:'', sub:$('fSubjectFilter').value, st:$('fStatusFilter').value};
  }
  function render(){
    var list=$('sessionsList');
    var f=currentFilters();
    var rows=allSessions.filter(function(s){
      if(f.fac && (!s.faculty || s.faculty.name!==f.fac)) return false;
      if(f.sub && (!s.subjects || s.subjects.name!==f.sub)) return false;
      if(f.st && s.status!==f.st) return false;
      return true;
    });
    if(!rows.length){ list.innerHTML='<div class="empty">No sessions found.</div>'; return; }
    list.innerHTML=rows.map(function(s){
      return '<div class="session-card"><div class="session-head"><div><div class="session-subject">'+esc(s.subjects&&s.subjects.name||'Unknown')+'</div>'+
      '<div class="session-meta">'+esc(s.log_date)+(isManager&&s.faculty?' \u00b7 '+esc(s.faculty.name):'')+(s.topic_label?' \u00b7 '+esc(s.topic_label):'')+(s.pct!=null?' \u00b7 '+esc(s.pct)+'% complete':'')+(s.hours?' \u00b7 '+esc(s.hours)+'h':'')+'</div></div>'+
      '<span class="badge '+esc(s.status)+'">'+esc(s.status)+'</span></div><div class="session-body">'+
      (s.covered?'<div><strong>Covered:</strong> '+esc(s.covered)+'</div>':'')+
      (s.leftover?'<div><strong>Leftover:</strong> '+esc(s.leftover)+'</div>':'')+
      (s.homework_detail?'<div><strong>Homework:</strong> '+esc(s.homework_detail)+'</div>':'')+
      (s.notes?'<div><strong>Notes:</strong> '+esc(s.notes)+'</div>':'')+
      '</div></div>';
    }).join('');
  }
  ['facultyFilter','subjectFilter','statusFilter','fSubjectFilter','fStatusFilter'].forEach(function(id){
    var el=$(id); if(el) el.addEventListener('change', render);
  });
  async function load(){
    var db=null;
    try{ if(window.MiraiDB&&MiraiDB.getSupabase){ db=MiraiDB.getSupabase(); if(db&&db.then) db=await db; } }catch(e){}
    if(!db){ $('sessionsList').innerHTML='<div class="empty">Database not connected.</div>'; return; }
    try{
      var query=db.from('session_logs').select('id,log_date,status,pct,hours,covered,leftover,homework_detail,notes,topic_label,subjects(id,name),faculty(id,name)').order('log_date',{ascending:false});
      if(!isManager&&facId) query=query.eq('faculty_id',facId);
      var res=await query;
      if(res.error) throw res.error;
      allSessions=res.data||[];
      populateFilters();
      render();
    }catch(e){ $('sessionsList').innerHTML='<div class="empty">Error: '+esc(e.message||e)+'</div>'; }
  }
  load();
})();
</script>
<script src="starfield.js"></script>
<script>
document.addEventListener('click', function(e){
  var a = e.target.closest('a.logout');
  if(a){
    try{ localStorage.removeItem('mirai_role'); localStorage.removeItem('mirai_fac'); localStorage.removeItem('mirai_student'); localStorage.removeItem('mirai_student_sec'); }catch(err){}
  }
});
</script>
</body>
</html>
